name: Update Money Rates Page

# ---------------------------------------------------------------------------
# This workflow is the active updater. A Docker/Unraid path also exists (see
# DEPLOY-UNRAID.md) but is currently INACTIVE. Only one of the two should ever
# run at a time -- if the Docker container is started, comment out the
# `schedule:` block below so both don't push competing rate updates.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A delayed hourly run must not overlap one that is still running.
concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate updated rates.html
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python generate_html.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rates.html trmnl_layout.json
          git commit -m "Update rates [ci skip]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
